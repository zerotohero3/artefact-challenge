[project]
name = "emporio"
version = "0.1.0"
description = "Agente de atendimento por texto da Empório da Música"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[google]>=2.65.0",
    "python-dotenv>=1.0",
]

[project.scripts]
emporio = "emporio.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
